services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - arc-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  arc:
    build:
      context: .
      dockerfile: Dockerfile
      # Explicit: the served image carries no tests and no test tooling.
      target: production
    environment: &arc_environment
      APP_ENV: ${APP_ENV}
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      JWT_SECRET: ${JWT_SECRET}
      JWT_ISSUER: ${JWT_ISSUER}
      JWT_AUDIENCE: ${JWT_AUDIENCE}
      JWT_EXPIRY_SECONDS: ${JWT_EXPIRY_SECONDS}
      APPLICATION_ROLE_ASSIGNMENTS: ${APPLICATION_ROLE_ASSIGNMENTS}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI:-http://localhost:5173/api/auth/callback}
      SESSION_EXPIRY_HOURS: ${SESSION_EXPIRY_HOURS:-24}
      CONNECTOR_CREDENTIALS: ${CONNECTOR_CREDENTIALS}
      CONNECTOR_PROVIDER_MODE: ${CONNECTOR_PROVIDER_MODE}
      WEBHOOK_INGESTION_ENDPOINTS: ${WEBHOOK_INGESTION_ENDPOINTS}
      LOG_LEVEL: ${LOG_LEVEL}
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-deterministic}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-deterministic-local}
      EMBEDDING_DIMENSION: ${EMBEDDING_DIMENSION:-1536}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OMNIROUTE_BASE_URL: ${OMNIROUTE_BASE_URL:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      LLM_PROVIDER: ${LLM_PROVIDER:-deterministic}
      LLM_MODEL: ${LLM_MODEL:-}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy


  # Test image: same application, plus tests/ and the test tooling. Behind a
  # profile so `docker compose up` and the e2e job never build it, while
  # `docker compose --profile test run --rm arc-test ...` does.
  #
  # It reuses the arc service's environment anchor so the suite runs against
  # the same configuration the application does; a drift between them would
  # mean CI validates something production never sees.
  arc-test:
    profiles: ["test"]
    build:
      context: .
      dockerfile: Dockerfile
      target: test
    environment: *arc_environment
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  arc-postgres-data:
