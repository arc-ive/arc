name: CI

on:
  push:
    branches:
      - main
      - "feat/**"
  pull_request:
    branches:
      - main

jobs:
  test:
    name: Lint, Format & Test
    runs-on: ubuntu-latest

    env:
      APP_ENV: test
      POSTGRES_DB: arc
      POSTGRES_USER: arc
      POSTGRES_PASSWORD: arc-test-password
      JWT_SECRET: arc-ci-jwt-secret-32-chars-long
      JWT_ISSUER: arc
      JWT_AUDIENCE: arc-api
      JWT_EXPIRY_SECONDS: "3600"
      APPLICATION_ROLE_ASSIGNMENTS: "{}"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build application image
        run: docker compose build arc

      - name: Run Ruff checks
        run: docker compose run --rm arc ruff check .

      - name: Check formatting
        run: docker compose run --rm arc ruff format --check .

      - name: Run tests
        run: docker compose run --rm arc python -m pytest -q

      - name: Cleanup
        if: always()
        run: docker compose down -v