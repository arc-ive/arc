name: CI

on:
  push:
    branches:
      - main
  # No branch filter. The previous `branches: [main]` meant a PR based on
  # anything other than main got NO checks at all — which silently disabled
  # CI across a stack of dependent PRs.
  pull_request:

permissions:
  contents: read

# Supersede an in-flight run when a PR is pushed again. Pushes to main are
# never cancelled, so every commit on main keeps a complete result.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # ---------------------------------------------------------------------
  # Image build jobs. Each target is built EXACTLY ONCE per run and
  # published to GHCR under an immutable digest. Every consumer job below
  # pulls that digest; none of them can build.
  #
  # A shared layer cache made the seven rebuilds cheap, but cheap is not
  # the same as identical: four shards each running their own build are
  # four artifacts that happen to agree, not one artifact under test. The
  # digest is what turns "the shards tested the same image" from an
  # assumption into something the logs can prove.
  # ---------------------------------------------------------------------

  build-test-image:
    name: Build test image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Requested for the same-repository push. On a fork PR GitHub issues a
      # read-only token regardless of what is requested here, and the push
      # step below is skipped for forks anyway — so this line can never give
      # untrusted code write access to ARC's package namespace.
      packages: write
    outputs:
      mode: ${{ steps.mode.outputs.mode }}
      # registry mode (same-repository)
      digest: ${{ steps.push.outputs.digest }}
      image: ghcr.io/${{ github.repository }}-test@${{ steps.push.outputs.digest }}
      # artifact mode (fork)
      artifact-name: arc-test-image
      local-tag: arc-app-test:ci
      image-id: ${{ steps.export.outputs.image-id }}
      tarball-sha256: ${{ steps.export.outputs.tarball-sha256 }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # One decision point for the whole workflow. A PR whose head repo is
      # not this repository is a fork: untrusted code, read-only token, no
      # secrets. Everything downstream keys off this single output rather
      # than re-deriving the condition and risking the two drifting apart.
      - name: Determine acquisition mode
        id: mode
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ] \
             && [ "${{ github.event.pull_request.head.repo.full_name }}" != "${{ github.repository }}" ]; then
            echo "mode=artifact" >> "$GITHUB_OUTPUT"
            echo "fork PR detected: image will be handed off as an ephemeral artifact"
          else
            echo "mode=registry" >> "$GITHUB_OUTPUT"
            echo "same-repository: image will be published to GHCR by digest"
          fi

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: steps.mode.outputs.mode == 'registry'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ---- registry mode: build once, push, hand consumers the digest ----
      #
      # The GHA layer cache does the heavy lifting in both modes: the
      # ~400 MB en_core_web_lg layer is keyed on pyproject.toml alone, so an
      # ordinary code change restores it rather than refetching it.
      - name: Build and push test image
        id: push
        if: steps.mode.outputs.mode == 'registry'
        uses: docker/build-push-action@v6
        with:
          context: .
          target: test
          push: true
          tags: |
            ghcr.io/${{ github.repository }}-test:${{ github.sha }}
          cache-from: type=gha,scope=arc-test
          cache-to: type=gha,mode=max,scope=arc-test
          # Provenance and SBOM travel with the image in the registry, so an
          # artifact can be traced back to the commit and workflow run that
          # produced it without consulting anything outside GHCR. Both are
          # buildx-native: no scanner, no service, no extra job.
          provenance: mode=max
          sbom: true

      # ---- artifact mode: build once, export, hand consumers a tarball ----
      #
      # Still exactly one build. The difference is only where the artifact
      # goes: a fork cannot publish to ARC's registry, so the image travels
      # as an Actions artifact instead. cache-to is omitted because a fork
      # PR must not be able to poison the cache that same-repository builds
      # read from.
      - name: Build test image for handoff
        id: build-local
        if: steps.mode.outputs.mode == 'artifact'
        uses: docker/build-push-action@v6
        with:
          context: .
          target: test
          load: true
          tags: arc-app-test:ci
          cache-from: type=gha,scope=arc-test

      - name: Export and fingerprint the image
        id: export
        if: steps.mode.outputs.mode == 'artifact'
        run: |
          mkdir -p /tmp/arc-image
          docker save arc-app-test:ci -o /tmp/arc-image/image.tar
          image_id="$(docker image inspect arc-app-test:ci --format '{{.Id}}')"
          tar_sha="$(sha256sum /tmp/arc-image/image.tar | cut -d' ' -f1)"
          echo "image-id=$image_id" >> "$GITHUB_OUTPUT"
          echo "tarball-sha256=$tar_sha" >> "$GITHUB_OUTPUT"
          echo "image id:      $image_id"
          echo "tarball sha256: $tar_sha"
          ls -l /tmp/arc-image/image.tar

      - name: Upload the image artifact
        if: steps.mode.outputs.mode == 'artifact'
        uses: actions/upload-artifact@v7
        with:
          name: arc-test-image
          path: /tmp/arc-image/image.tar
          retention-days: 1
          # Already a compressed image; recompressing costs minutes and saves
          # almost nothing.
          compression-level: 0

      # Written to the run summary, not just the log. Which artifact a run
      # tested is the first question asked when something is wrong, and
      # scrolling a job log to find it is friction at exactly the wrong
      # moment.
      - name: Report the artifact consumers will receive
        run: |
          {
            echo "### Test image"
            echo ""
            echo "| field | value |"
            echo "|---|---|"
            echo "| mode | \`${{ steps.mode.outputs.mode }}\` |"
            echo "| commit | \`${{ github.sha }}\` |"
            echo "| run | [\`${{ github.run_id }}\`](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) |"
            if [ "${{ steps.mode.outputs.mode }}" = "registry" ]; then
              echo "| image | \`ghcr.io/${{ github.repository }}-test@${{ steps.push.outputs.digest }}\` |"
              echo "| digest | \`${{ steps.push.outputs.digest }}\` |"
            else
              echo "| artifact | \`arc-test-image\` |"
              echo "| tag | \`arc-app-test:ci\` |"
              echo "| image id | \`${{ steps.export.outputs.image-id }}\` |"
              echo "| tarball sha256 | \`${{ steps.export.outputs.tarball-sha256 }}\` |"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          cat "$GITHUB_STEP_SUMMARY"

  build-production-image:
    name: Build production image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Requested for the same-repository push. On a fork PR GitHub issues a
      # read-only token regardless of what is requested here, and the push
      # step below is skipped for forks anyway — so this line can never give
      # untrusted code write access to ARC's package namespace.
      packages: write
    outputs:
      mode: ${{ steps.mode.outputs.mode }}
      # registry mode (same-repository)
      digest: ${{ steps.push.outputs.digest }}
      image: ghcr.io/${{ github.repository }}@${{ steps.push.outputs.digest }}
      # artifact mode (fork)
      artifact-name: arc-production-image
      local-tag: arc-app:ci
      image-id: ${{ steps.export.outputs.image-id }}
      tarball-sha256: ${{ steps.export.outputs.tarball-sha256 }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # One decision point for the whole workflow. A PR whose head repo is
      # not this repository is a fork: untrusted code, read-only token, no
      # secrets. Everything downstream keys off this single output rather
      # than re-deriving the condition and risking the two drifting apart.
      - name: Determine acquisition mode
        id: mode
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ] \
             && [ "${{ github.event.pull_request.head.repo.full_name }}" != "${{ github.repository }}" ]; then
            echo "mode=artifact" >> "$GITHUB_OUTPUT"
            echo "fork PR detected: image will be handed off as an ephemeral artifact"
          else
            echo "mode=registry" >> "$GITHUB_OUTPUT"
            echo "same-repository: image will be published to GHCR by digest"
          fi

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: steps.mode.outputs.mode == 'registry'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ---- registry mode: build once, push, hand consumers the digest ----
      #
      # The GHA layer cache does the heavy lifting in both modes: the
      # ~400 MB en_core_web_lg layer is keyed on pyproject.toml alone, so an
      # ordinary code change restores it rather than refetching it.
      - name: Build and push production image
        id: push
        if: steps.mode.outputs.mode == 'registry'
        uses: docker/build-push-action@v6
        with:
          context: .
          target: production
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:${{ github.sha }}
          cache-from: type=gha,scope=arc-prod
          cache-to: type=gha,mode=max,scope=arc-prod
          # The production image is the one that would ever be promoted, so
          # its provenance matters most: attestation records the commit, the
          # workflow run and the build inputs.
          provenance: mode=max
          sbom: true

      # ---- artifact mode: build once, export, hand consumers a tarball ----
      #
      # Still exactly one build. The difference is only where the artifact
      # goes: a fork cannot publish to ARC's registry, so the image travels
      # as an Actions artifact instead. cache-to is omitted because a fork
      # PR must not be able to poison the cache that same-repository builds
      # read from.
      - name: Build production image for handoff
        id: build-local
        if: steps.mode.outputs.mode == 'artifact'
        uses: docker/build-push-action@v6
        with:
          context: .
          target: production
          load: true
          tags: arc-app:ci
          cache-from: type=gha,scope=arc-prod

      - name: Export and fingerprint the image
        id: export
        if: steps.mode.outputs.mode == 'artifact'
        run: |
          mkdir -p /tmp/arc-image
          docker save arc-app:ci -o /tmp/arc-image/image.tar
          image_id="$(docker image inspect arc-app:ci --format '{{.Id}}')"
          tar_sha="$(sha256sum /tmp/arc-image/image.tar | cut -d' ' -f1)"
          echo "image-id=$image_id" >> "$GITHUB_OUTPUT"
          echo "tarball-sha256=$tar_sha" >> "$GITHUB_OUTPUT"
          echo "image id:      $image_id"
          echo "tarball sha256: $tar_sha"
          ls -l /tmp/arc-image/image.tar

      - name: Upload the image artifact
        if: steps.mode.outputs.mode == 'artifact'
        uses: actions/upload-artifact@v7
        with:
          name: arc-production-image
          path: /tmp/arc-image/image.tar
          retention-days: 1
          # Already a compressed image; recompressing costs minutes and saves
          # almost nothing.
          compression-level: 0

      # Written to the run summary, not just the log. Which artifact a run
      # tested is the first question asked when something is wrong, and
      # scrolling a job log to find it is friction at exactly the wrong
      # moment.
      - name: Report the artifact consumers will receive
        run: |
          {
            echo "### Production image"
            echo ""
            echo "| field | value |"
            echo "|---|---|"
            echo "| mode | \`${{ steps.mode.outputs.mode }}\` |"
            echo "| commit | \`${{ github.sha }}\` |"
            echo "| run | [\`${{ github.run_id }}\`](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) |"
            if [ "${{ steps.mode.outputs.mode }}" = "registry" ]; then
              echo "| image | \`ghcr.io/${{ github.repository }}@${{ steps.push.outputs.digest }}\` |"
              echo "| digest | \`${{ steps.push.outputs.digest }}\` |"
            else
              echo "| artifact | \`arc-production-image\` |"
              echo "| tag | \`arc-app:ci\` |"
              echo "| image id | \`${{ steps.export.outputs.image-id }}\` |"
              echo "| tarball sha256 | \`${{ steps.export.outputs.tarball-sha256 }}\` |"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          cat "$GITHUB_STEP_SUMMARY"

  lint:
    name: Lint & Format
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Ruff is pinned exactly in pyproject.toml and read from there, so the
      # linter cannot drift between a developer's machine, this job, and the
      # application image. Linting needs neither the application image nor
      # PostgreSQL, so this job builds nothing.
      - name: Resolve the pinned Ruff version
        id: ruff
        run: |
          set -euo pipefail
          version=$(python - <<'PY'
          import sys
          import tomllib

          with open("pyproject.toml", "rb") as fh:
              dev = tomllib.load(fh)["project"]["optional-dependencies"]["dev"]
          pins = [d for d in dev if d.startswith("ruff==")]
          if len(pins) != 1:
              sys.exit(
                  "pyproject.toml must pin Ruff exactly (ruff==X.Y.Z) so this job, "
                  "the application image, and developer machines all lint with the "
                  f"same version. Found: {[d for d in dev if d.startswith('ruff')]}"
              )
          print(pins[0].split("==", 1)[1])
          PY
          )
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Pinned Ruff version: $version"

      - name: Install Ruff
        run: python -m pip install "ruff==${{ steps.ruff.outputs.version }}"

      - name: Run Ruff checks
        run: ruff check .

      - name: Check formatting
        run: ruff format --check .

      # The CI contract is validated HERE, not in the sharded suite, because
      # these tests read .github/ and docker-compose.ci.yml — repository
      # configuration, which the test image deliberately does not ship. They
      # need no database and no application image.
      #
      # ARC_REQUIRE_CI_ARCHITECTURE_TESTS turns "files not found" from a skip
      # into a hard error, so the invariant cannot quietly stop being checked.
      - name: Install CI-contract test dependencies
        run: python -m pip install "pytest>=8.4,<9.0" "PyYAML>=6.0,<7.0"

      - name: Validate the CI image contract
        env:
          ARC_REQUIRE_CI_ARCHITECTURE_TESTS: "1"
        # --noconftest: tests/conftest.py imports arc and opens a database
        # connection for the application suite. This job installs neither and
        # needs neither — these tests read files, nothing more. Without the
        # flag collection fails on the import before a single assertion runs.
        run: |
          python -m pytest tests/test_ci_architecture.py -q -p no:randomly \
            --no-header -p no:cacheprovider --noconftest

  test:
    name: Test (shard ${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    needs: build-test-image
    permissions:
      contents: read
      packages: read

    strategy:
      # Every shard reports independently: one failing shard must not hide
      # results from the other three.
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]

    env:
      APP_ENV: development
      POSTGRES_DB: arc_test
      POSTGRES_USER: arc
      POSTGRES_PASSWORD: arc-ci-password
      JWT_SECRET: arc-ci-jwt-secret-change-me-please-32chars
      JWT_ISSUER: arc
      JWT_AUDIENCE: arc-api
      JWT_EXPIRY_SECONDS: "3600"
      APPLICATION_ROLE_ASSIGNMENTS: "{}"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Registry login is needed only when the image comes from GHCR. A fork
      # run has no credentials to log in with, and needs none: its image
      # arrives as an Actions artifact.
      - name: Log in to GHCR
        if: needs.build-test-image.outputs.mode == 'registry'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The ONLY sanctioned way this job obtains an ARC image. It acquires
      # and then PROVES the artifact is the one the build job produced. It
      # cannot build: docker-compose.ci.yml strips the build context and
      # sets pull_policy:never.
      - name: Acquire the test image
        id: image
        uses: ./.github/actions/acquire-arc-image
        with:
          mode: ${{ needs.build-test-image.outputs.mode }}
          image-ref: ${{ needs.build-test-image.outputs.image }}
          expected-digest: ${{ needs.build-test-image.outputs.digest }}
          artifact-name: ${{ needs.build-test-image.outputs.artifact-name }}
          local-tag: ${{ needs.build-test-image.outputs.local-tag }}
          expected-image-id: ${{ needs.build-test-image.outputs.image-id }}
          expected-tarball-sha256: ${{ needs.build-test-image.outputs.tarball-sha256 }}

      # Each shard is its own runner with its own PostgreSQL container, so the
      # session fixture's DROP SCHEMA only ever affects that shard's database.
      # pytest-split balances the four groups by the durations recorded in
      # .test_durations; if that file is absent it falls back to splitting by
      # test count, so a stale or missing file slows CI but never breaks it.
      - name: Run tests (shard ${{ matrix.shard }} of 4)
        env:
          ARC_TEST_IMAGE: ${{ steps.image.outputs.image }}
        run: |
          docker compose -f docker-compose.yml -f docker-compose.ci.yml --profile test run --rm arc-test \
            python -m pytest -q --splits 4 --group ${{ matrix.shard }}

      - name: Cleanup
        if: always()
        env:
          ARC_TEST_IMAGE: ${{ steps.image.outputs.image }}
        run: docker compose -f docker-compose.yml -f docker-compose.ci.yml down -v

  production-config:
    name: Production config boundary
    runs-on: ubuntu-latest
    needs: build-test-image
    permissions:
      contents: read
      packages: read

    # The sharded suite above runs with APP_ENV=development, which mounts the
    # development auth routers and marks cookies Secure=False. That means the
    # production boundary is never evaluated there. This job runs the same
    # application with a production APP_ENV and asserts the boundary holds:
    # no /internal/dev routes, and Secure cookies.
    env:
      APP_ENV: production
      POSTGRES_DB: arc_test
      POSTGRES_USER: arc
      POSTGRES_PASSWORD: arc-ci-password
      JWT_SECRET: arc-ci-jwt-secret-change-me-please-32chars
      JWT_ISSUER: arc
      JWT_AUDIENCE: arc-api
      JWT_EXPIRY_SECONDS: "3600"
      APPLICATION_ROLE_ASSIGNMENTS: "{}"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Registry login is needed only when the image comes from GHCR. A fork
      # run has no credentials to log in with, and needs none: its image
      # arrives as an Actions artifact.
      - name: Log in to GHCR
        if: needs.build-test-image.outputs.mode == 'registry'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The ONLY sanctioned way this job obtains an ARC image. It acquires
      # and then PROVES the artifact is the one the build job produced. It
      # cannot build: docker-compose.ci.yml strips the build context and
      # sets pull_policy:never.
      - name: Acquire the test image
        id: image
        uses: ./.github/actions/acquire-arc-image
        with:
          mode: ${{ needs.build-test-image.outputs.mode }}
          image-ref: ${{ needs.build-test-image.outputs.image }}
          expected-digest: ${{ needs.build-test-image.outputs.digest }}
          artifact-name: ${{ needs.build-test-image.outputs.artifact-name }}
          local-tag: ${{ needs.build-test-image.outputs.local-tag }}
          expected-image-id: ${{ needs.build-test-image.outputs.image-id }}
          expected-tarball-sha256: ${{ needs.build-test-image.outputs.tarball-sha256 }}

      # PostgreSQL is started even though these tests only inspect the route
      # table and cookie helpers: tests/conftest.py has a session-scoped
      # autouse fixture (_initialize_schema) that connects to the database
      # before any test in tests/ runs, so --no-deps errors the whole file.
      - name: Assert the production configuration boundary
        env:
          ARC_TEST_IMAGE: ${{ steps.image.outputs.image }}
        run: |
          docker compose -f docker-compose.yml -f docker-compose.ci.yml --profile test run --rm arc-test \
            python -m pytest tests/test_production_config.py -q

      - name: Cleanup
        if: always()
        env:
          ARC_TEST_IMAGE: ${{ steps.image.outputs.image }}
        run: docker compose -f docker-compose.yml -f docker-compose.ci.yml down -v

  schema-bootstrap:
    name: Schema Bootstrap (fresh DB)
    runs-on: ubuntu-latest
    needs: build-test-image
    permissions:
      contents: read
      packages: read

    env:
      APP_ENV: development
      POSTGRES_DB: arc_test
      POSTGRES_USER: arc
      POSTGRES_PASSWORD: arc-ci-password
      JWT_SECRET: arc-ci-jwt-secret-change-me-please-32chars
      JWT_ISSUER: arc
      JWT_AUDIENCE: arc-api
      JWT_EXPIRY_SECONDS: "3600"
      APPLICATION_ROLE_ASSIGNMENTS: "{}"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Registry login is needed only when the image comes from GHCR. A fork
      # run has no credentials to log in with, and needs none: its image
      # arrives as an Actions artifact.
      - name: Log in to GHCR
        if: needs.build-test-image.outputs.mode == 'registry'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The ONLY sanctioned way this job obtains an ARC image. It acquires
      # and then PROVES the artifact is the one the build job produced. It
      # cannot build: docker-compose.ci.yml strips the build context and
      # sets pull_policy:never.
      - name: Acquire the test image
        id: image
        uses: ./.github/actions/acquire-arc-image
        with:
          mode: ${{ needs.build-test-image.outputs.mode }}
          image-ref: ${{ needs.build-test-image.outputs.image }}
          expected-digest: ${{ needs.build-test-image.outputs.digest }}
          artifact-name: ${{ needs.build-test-image.outputs.artifact-name }}
          local-tag: ${{ needs.build-test-image.outputs.local-tag }}
          expected-image-id: ${{ needs.build-test-image.outputs.image-id }}
          expected-tarball-sha256: ${{ needs.build-test-image.outputs.tarball-sha256 }}

      # This job proves the application provisions the full schema from
      # src/arc/db/schema.sql on startup against a genuinely empty
      # database — not via tests/conftest.py's DROP SCHEMA bootstrap.
      # The test creates a temporary empty database (arc_bootstrap_*)
      # and verifies ArcDatabase.ensure_schema() provisions all tables
      # and is idempotent, leaving existing data intact.
      - name: Run schema bootstrap tests (fresh DB)
        env:
          ARC_TEST_IMAGE: ${{ steps.image.outputs.image }}
        run: |
          docker compose -f docker-compose.yml -f docker-compose.ci.yml --profile test run --rm arc-test \
            python -m pytest tests/test_schema_bootstrap.py -v

      - name: Cleanup
        if: always()
        env:
          ARC_TEST_IMAGE: ${{ steps.image.outputs.image }}
        run: docker compose -f docker-compose.yml -f docker-compose.ci.yml down -v

  frontend:
    name: Frontend (lint, test, build)
    runs-on: ubuntu-latest

    # The backend jobs above run Ruff and pytest. Neither touches
    # frontend/, so until now a frontend-only pull request could report
    # seven green checks while nothing had exercised the code it changed.
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          # Vite 8 uses rolldown, whose platform-specific native binding npm
          # silently skips when EBADENGINE fires on an older Node. >=22.19
          # satisfies it.
          node-version: "22.19"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Run tests
        run: npm test

      - name: Build
        run: npm run build

  e2e:
    name: Playwright E2E (Phase 1-3)
    runs-on: ubuntu-latest
    needs: build-production-image
    permissions:
      contents: read
      packages: read

    # Inherits the workflow-minimum contents:read. upload-artifact@v4
    # uses its own artifact scope and needs nothing beyond that.
    # Same ephemeral CI backend as the sharded pytest suite, except
    # APPLICATION_ROLE_ASSIGNMENTS carries the development role mapping
    # from .env.example: the Playwright auth setup logs in as the seeded
    # reference users (ref-*-company-admin / ops-user / employee-1), which
    # only hold application roles through this mapping. All identities are
    # synthetic; no real credentials or live provider keys are involved
    # (LLM/embedding providers default to deterministic in compose).
    env:
      APP_ENV: development
      POSTGRES_DB: arc_test
      POSTGRES_USER: arc
      POSTGRES_PASSWORD: arc-ci-password
      JWT_SECRET: arc-ci-jwt-secret-change-me-please-32chars
      JWT_ISSUER: arc
      JWT_AUDIENCE: arc-api
      JWT_EXPIRY_SECONDS: "3600"
      APPLICATION_ROLE_ASSIGNMENTS: '{"ref-platform-admin": "platform_administrator", "ref-acme-technologies-company-admin": "company_administrator", "ref-acme-technologies-ops-user": "operations_user", "ref-acme-technologies-employee-1": "employee", "ref-acme-technologies-employee-2": "employee", "ref-nova-systems-company-admin": "company_administrator", "ref-nova-systems-ops-user": "operations_user", "ref-nova-systems-employee-1": "employee", "ref-nova-systems-employee-2": "employee", "ref-vertex-solutions-company-admin": "company_administrator", "ref-vertex-solutions-ops-user": "operations_user", "ref-vertex-solutions-employee-1": "employee", "ref-vertex-solutions-employee-2": "employee", "ref-northstar-digital-company-admin": "company_administrator", "ref-northstar-digital-ops-user": "operations_user", "ref-northstar-digital-employee-1": "employee", "ref-northstar-digital-employee-2": "employee"}'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22.19"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
        working-directory: frontend

      # Published ports (8000/5432) so the runner-local vite server and
      # Playwright can reach the backend; `compose run` would not publish
      # them. Bounded poll on /health, not a fixed sleep.
      # e2e exercises the PRODUCTION image — the one that actually ships —
      # and consumes the exact artifact build-production-image published.
      # It builds nothing: compose runs with pull_policy:never and no build
      # section, so the only image it can start is the digest pulled here.
      - name: Log in to GHCR
        if: needs.build-production-image.outputs.mode == 'registry'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Acquire the production image
        id: image
        uses: ./.github/actions/acquire-arc-image
        with:
          mode: ${{ needs.build-production-image.outputs.mode }}
          image-ref: ${{ needs.build-production-image.outputs.image }}
          expected-digest: ${{ needs.build-production-image.outputs.digest }}
          artifact-name: ${{ needs.build-production-image.outputs.artifact-name }}
          local-tag: ${{ needs.build-production-image.outputs.local-tag }}
          expected-image-id: ${{ needs.build-production-image.outputs.image-id }}
          expected-tarball-sha256: ${{ needs.build-production-image.outputs.tarball-sha256 }}

      - name: Start backend and database
        env:
          ARC_IMAGE: ${{ steps.image.outputs.image }}
        run: |
          set -euo pipefail
          docker compose -f docker-compose.yml -f docker-compose.ci.yml up -d
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:8000/health > /dev/null; then
              break
            fi
            sleep 2
          done
          curl -fsS http://localhost:8000/health > /dev/null

      # Runs the full Playwright QA suite through the existing script:
      # Phase 1 smoke, Phase 2 tenant isolation, Phase 3 workflows + RBAC.
      # The config starts vite itself; the CI=true runner default enables
      # forbid-only, retries, and the github reporter.
      - name: Run Playwright E2E
        run: npm run test:e2e
        working-directory: frontend

      # Failure debugging only: the HTML report plus traces/screenshots.
      # e2e/.auth/ (live session cookies) is never uploaded.
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7

      - name: Cleanup
        if: always()
        env:
          ARC_IMAGE: ${{ steps.image.outputs.image }}
        run: docker compose -f docker-compose.yml -f docker-compose.ci.yml down -v
