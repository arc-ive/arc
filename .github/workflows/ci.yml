name: CI

on:
  push:
    branches:
      - main
  # No branch filter. The previous `branches: [main]` meant a PR based on
  # anything other than main got NO checks at all — which silently disabled
  # CI across a stack of dependent PRs.
  pull_request:

permissions:
  contents: read

# Supersede an in-flight run when a PR is pushed again. Pushes to main are
# never cancelled, so every commit on main keeps a complete result.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Ruff is pinned exactly in pyproject.toml and read from there, so the
      # linter cannot drift between a developer's machine, this job, and the
      # application image. Linting needs neither the application image nor
      # PostgreSQL, so this job builds nothing.
      - name: Resolve the pinned Ruff version
        id: ruff
        run: |
          set -euo pipefail
          version=$(python - <<'PY'
          import sys
          import tomllib

          with open("pyproject.toml", "rb") as fh:
              dev = tomllib.load(fh)["project"]["optional-dependencies"]["dev"]
          pins = [d for d in dev if d.startswith("ruff==")]
          if len(pins) != 1:
              sys.exit(
                  "pyproject.toml must pin Ruff exactly (ruff==X.Y.Z) so this job, "
                  "the application image, and developer machines all lint with the "
                  f"same version. Found: {[d for d in dev if d.startswith('ruff')]}"
              )
          print(pins[0].split("==", 1)[1])
          PY
          )
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Pinned Ruff version: $version"

      - name: Install Ruff
        run: python -m pip install "ruff==${{ steps.ruff.outputs.version }}"

      - name: Run Ruff checks
        run: ruff check .

      - name: Check formatting
        run: ruff format --check .

  test:
    name: Test (shard ${{ matrix.shard }}/4)
    runs-on: ubuntu-latest

    strategy:
      # Every shard reports independently: one failing shard must not hide
      # results from the other three.
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]

    env:
      APP_ENV: development
      POSTGRES_DB: arc_test
      POSTGRES_USER: arc
      POSTGRES_PASSWORD: arc-ci-password
      JWT_SECRET: arc-ci-jwt-secret-change-me-please-32chars
      JWT_ISSUER: arc
      JWT_AUDIENCE: arc-api
      JWT_EXPIRY_SECONDS: "3600"
      APPLICATION_ROLE_ASSIGNMENTS: "{}"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Buildx + the Actions cache replace a cold `docker compose build`.
      # Before this, the image was rebuilt from scratch 7 times per run (4
      # shards + production-config + schema-bootstrap + e2e), each one
      # re-downloading the ~400 MB en_core_web_lg wheel. The dependency layer
      # is keyed on pyproject.toml alone, so an ordinary code change now
      # restores it from cache instead of refetching the model.
      #
      # scope=test is shared by every job that needs the test image, so they
      # populate and read one cache entry rather than three. `load: true`
      # puts the image in the local daemon under the tag compose expects, so
      # the compose step below finds it and does not rebuild.
      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build test image (cached)
        uses: docker/build-push-action@v6
        with:
          context: .
          target: test
          tags: arc-app-test:local
          load: true
          cache-from: type=gha,scope=arc-test
          cache-to: type=gha,mode=max,scope=arc-test

      # Each shard is its own runner with its own PostgreSQL container, so the
      # session fixture's DROP SCHEMA only ever affects that shard's database.
      # pytest-split balances the four groups by the durations recorded in
      # .test_durations; if that file is absent it falls back to splitting by
      # test count, so a stale or missing file slows CI but never breaks it.
      - name: Run tests (shard ${{ matrix.shard }} of 4)
        run: |
          docker compose --profile test run --rm arc-test \
            python -m pytest -q --splits 4 --group ${{ matrix.shard }}

      - name: Cleanup
        if: always()
        run: docker compose down -v

  production-config:
    name: Production config boundary
    runs-on: ubuntu-latest

    # The sharded suite above runs with APP_ENV=development, which mounts the
    # development auth routers and marks cookies Secure=False. That means the
    # production boundary is never evaluated there. This job runs the same
    # application with a production APP_ENV and asserts the boundary holds:
    # no /internal/dev routes, and Secure cookies.
    env:
      APP_ENV: production
      POSTGRES_DB: arc_test
      POSTGRES_USER: arc
      POSTGRES_PASSWORD: arc-ci-password
      JWT_SECRET: arc-ci-jwt-secret-change-me-please-32chars
      JWT_ISSUER: arc
      JWT_AUDIENCE: arc-api
      JWT_EXPIRY_SECONDS: "3600"
      APPLICATION_ROLE_ASSIGNMENTS: "{}"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Buildx + the Actions cache replace a cold `docker compose build`.
      # Before this, the image was rebuilt from scratch 7 times per run (4
      # shards + production-config + schema-bootstrap + e2e), each one
      # re-downloading the ~400 MB en_core_web_lg wheel. The dependency layer
      # is keyed on pyproject.toml alone, so an ordinary code change now
      # restores it from cache instead of refetching the model.
      #
      # scope=test is shared by every job that needs the test image, so they
      # populate and read one cache entry rather than three. `load: true`
      # puts the image in the local daemon under the tag compose expects, so
      # the compose step below finds it and does not rebuild.
      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build test image (cached)
        uses: docker/build-push-action@v6
        with:
          context: .
          target: test
          tags: arc-app-test:local
          load: true
          cache-from: type=gha,scope=arc-test
          cache-to: type=gha,mode=max,scope=arc-test

      # PostgreSQL is started even though these tests only inspect the route
      # table and cookie helpers: tests/conftest.py has a session-scoped
      # autouse fixture (_initialize_schema) that connects to the database
      # before any test in tests/ runs, so --no-deps errors the whole file.
      - name: Assert the production configuration boundary
        run: |
          docker compose --profile test run --rm arc-test \
            python -m pytest tests/test_production_config.py -q

      - name: Cleanup
        if: always()
        run: docker compose down -v

  schema-bootstrap:
    name: Schema Bootstrap (fresh DB)
    runs-on: ubuntu-latest

    env:
      APP_ENV: development
      POSTGRES_DB: arc_test
      POSTGRES_USER: arc
      POSTGRES_PASSWORD: arc-ci-password
      JWT_SECRET: arc-ci-jwt-secret-change-me-please-32chars
      JWT_ISSUER: arc
      JWT_AUDIENCE: arc-api
      JWT_EXPIRY_SECONDS: "3600"
      APPLICATION_ROLE_ASSIGNMENTS: "{}"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Buildx + the Actions cache replace a cold `docker compose build`.
      # Before this, the image was rebuilt from scratch 7 times per run (4
      # shards + production-config + schema-bootstrap + e2e), each one
      # re-downloading the ~400 MB en_core_web_lg wheel. The dependency layer
      # is keyed on pyproject.toml alone, so an ordinary code change now
      # restores it from cache instead of refetching the model.
      #
      # scope=test is shared by every job that needs the test image, so they
      # populate and read one cache entry rather than three. `load: true`
      # puts the image in the local daemon under the tag compose expects, so
      # the compose step below finds it and does not rebuild.
      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build test image (cached)
        uses: docker/build-push-action@v6
        with:
          context: .
          target: test
          tags: arc-app-test:local
          load: true
          cache-from: type=gha,scope=arc-test
          cache-to: type=gha,mode=max,scope=arc-test

      # This job proves the application provisions the full schema from
      # src/arc/db/schema.sql on startup against a genuinely empty
      # database — not via tests/conftest.py's DROP SCHEMA bootstrap.
      # The test creates a temporary empty database (arc_bootstrap_*)
      # and verifies ArcDatabase.ensure_schema() provisions all tables
      # and is idempotent, leaving existing data intact.
      - name: Run schema bootstrap tests (fresh DB)
        run: |
          docker compose --profile test run --rm arc-test \
            python -m pytest tests/test_schema_bootstrap.py -v

      - name: Cleanup
        if: always()
        run: docker compose down -v

  frontend:
    name: Frontend (lint, test, build)
    runs-on: ubuntu-latest

    # The backend jobs above run Ruff and pytest. Neither touches
    # frontend/, so until now a frontend-only pull request could report
    # seven green checks while nothing had exercised the code it changed.
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          # Vite 8 uses rolldown, whose platform-specific native binding npm
          # silently skips when EBADENGINE fires on an older Node. >=22.19
          # satisfies it.
          node-version: "22.19"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Run tests
        run: npm test

      - name: Build
        run: npm run build

  e2e:
    name: Playwright E2E (Phase 1-3)
    runs-on: ubuntu-latest

    # Inherits the workflow-minimum contents:read. upload-artifact@v4
    # uses its own artifact scope and needs nothing beyond that.
    # Same ephemeral CI backend as the sharded pytest suite, except
    # APPLICATION_ROLE_ASSIGNMENTS carries the development role mapping
    # from .env.example: the Playwright auth setup logs in as the seeded
    # reference users (ref-*-company-admin / ops-user / employee-1), which
    # only hold application roles through this mapping. All identities are
    # synthetic; no real credentials or live provider keys are involved
    # (LLM/embedding providers default to deterministic in compose).
    env:
      APP_ENV: development
      POSTGRES_DB: arc_test
      POSTGRES_USER: arc
      POSTGRES_PASSWORD: arc-ci-password
      JWT_SECRET: arc-ci-jwt-secret-change-me-please-32chars
      JWT_ISSUER: arc
      JWT_AUDIENCE: arc-api
      JWT_EXPIRY_SECONDS: "3600"
      APPLICATION_ROLE_ASSIGNMENTS: '{"ref-platform-admin": "platform_administrator", "ref-acme-technologies-company-admin": "company_administrator", "ref-acme-technologies-ops-user": "operations_user", "ref-acme-technologies-employee-1": "employee", "ref-acme-technologies-employee-2": "employee", "ref-nova-systems-company-admin": "company_administrator", "ref-nova-systems-ops-user": "operations_user", "ref-nova-systems-employee-1": "employee", "ref-nova-systems-employee-2": "employee", "ref-vertex-solutions-company-admin": "company_administrator", "ref-vertex-solutions-ops-user": "operations_user", "ref-vertex-solutions-employee-1": "employee", "ref-vertex-solutions-employee-2": "employee", "ref-northstar-digital-company-admin": "company_administrator", "ref-northstar-digital-ops-user": "operations_user", "ref-northstar-digital-employee-1": "employee", "ref-northstar-digital-employee-2": "employee"}'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22.19"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
        working-directory: frontend

      # Published ports (8000/5432) so the runner-local vite server and
      # Playwright can reach the backend; `compose run` would not publish
      # them. Bounded poll on /health, not a fixed sleep.
      # e2e exercises the PRODUCTION image — the one that actually ships —
      # rather than the test image. Built here with the Actions cache so the
      # dependency layer is restored instead of refetched, then started
      # without --build so compose reuses this exact image.
      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build production image (cached)
        uses: docker/build-push-action@v6
        with:
          context: .
          target: production
          tags: arc-app:local
          load: true
          cache-from: type=gha,scope=arc-prod
          cache-to: type=gha,mode=max,scope=arc-prod

      - name: Start backend and database
        run: |
          set -euo pipefail
          docker compose up -d
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:8000/health > /dev/null; then
              break
            fi
            sleep 2
          done
          curl -fsS http://localhost:8000/health > /dev/null

      # Runs the full Playwright QA suite through the existing script:
      # Phase 1 smoke, Phase 2 tenant isolation, Phase 3 workflows + RBAC.
      # The config starts vite itself; the CI=true runner default enables
      # forbid-only, retries, and the github reporter.
      - name: Run Playwright E2E
        run: npm run test:e2e
        working-directory: frontend

      # Failure debugging only: the HTML report plus traces/screenshots.
      # e2e/.auth/ (live session cookies) is never uploaded.
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7

      - name: Cleanup
        if: always()
        run: docker compose down -v
