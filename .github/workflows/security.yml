name: Security

# Split from ci.yml deliberately.
#
# These checks answer a different question. CI asks "does this change work?"
# and must block the merge. These ask "has the world changed underneath us?"
# — a CVE published against a dependency ARC already shipped makes a run red
# on a PR that did not touch it, which teaches people to ignore red.
#
# So: run on PRs that actually change dependencies, on main, and on a
# schedule. A scheduled failure is a real signal (something new was
# disclosed) rather than noise attached to an unrelated change.
#
# Scope is ARC's actual risk surface, not a checklist. ARC is multi-tenant,
# stores tenant documents, encrypts connector credentials at rest, and runs
# PII detection over customer text. A vulnerable transitive dependency in
# that path is a tenant-data problem, which is why dependency auditing earns
# its place. Tools that would duplicate what GitHub already provides
# natively (secret scanning, Dependabot alerts) are not reimplemented here.

on:
  pull_request:
    paths:
      - 'pyproject.toml'
      - 'frontend/package.json'
      - 'frontend/package-lock.json'
      - 'Dockerfile'
      - '.github/workflows/security.yml'
  push:
    branches: [main]
  schedule:
    # 03:17 UTC — an odd minute on purpose: the top of the hour is when
    # every scheduled workflow on GitHub contends for runners.
    - cron: '17 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  python-dependencies:
    name: Python dependency audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip

      # pip-audit queries the Python Packaging Advisory Database against the
      # resolved environment, so it sees transitive dependencies — which is
      # where this class of problem actually lives. Chosen over a generic
      # scanner because it understands Python resolution rather than guessing
      # from a manifest.
      - name: Install ARC and pip-audit
        run: |
          python -m pip install --upgrade pip
          python -m pip install .
          python -m pip install pip-audit

      # Audits what is actually installed, including the spaCy/Presidio tree,
      # which a manifest-only scan misses.
      #
      # --strict is NOT used: it treats "could not audit" as an error, and
      # ARC's own package plus the two direct-URL spaCy model wheels are not
      # on PyPI by construction. Failing on those would be a permanently red
      # gate that says nothing about security.
      #
      # KNOWN EXCEPTIONS. Each is ignored with a reason, not waved through.
      # Anything NOT on this list fails the job, which is what gives the gate
      # teeth. Review this list whenever Presidio is upgraded.
      #
      #   PYSEC-2026-3552/3553/3554  cryptography 48.0.1
      #     ARC does not depend on cryptography directly. presidio-anonymizer
      #     pins it to >=48.0.1,<49.0.0, and the fixes are 49.0.0 and 50.0.0 —
      #     outside that range. Overriding an upstream pin to satisfy a
      #     scanner risks breaking the anonymizer that enforces ARC's PII
      #     boundary, which is a worse outcome than the CVEs. Genuinely
      #     relevant: cryptography sits in the connector-credential and
      #     approval-argument encryption path, so this needs revisiting the
      #     moment Presidio relaxes the pin.
      #
      #   PYSEC-2026-1845  pytest 8.4.2
      #     Dev-only, and verified absent from the production image: the
      #     prod/test split means pytest is not installed in the runtime
      #     container at all. The fix is pytest 9.0.3, outside the
      #     >=8.4,<9.0 pin; bumping the major is a test-infrastructure
      #     decision, not a security fix for anything ARC ships.
      - name: Audit installed dependencies
        run: |
          set -o pipefail
          pip-audit --progress-spinner off --format columns \
            --ignore-vuln PYSEC-2026-3552 \
            --ignore-vuln PYSEC-2026-3553 \
            --ignore-vuln PYSEC-2026-3554 \
            --ignore-vuln PYSEC-2026-1845 \
            | tee /tmp/pip-audit.txt

      # Reported separately and never gating, so the exceptions stay visible
      # instead of quietly becoming permanent.
      - name: Report the full picture including ignored findings
        if: always()
        run: |
          pip-audit --progress-spinner off --format columns \
            > /tmp/pip-audit-full.txt 2>&1 || true
          {
            echo "### Python dependency audit"
            echo ""
            echo "**Gate result** (known exceptions ignored):"
            echo '```'
            cat /tmp/pip-audit.txt 2>/dev/null || echo "no output"
            echo '```'
            echo ""
            echo "**All findings including accepted exceptions:**"
            echo '```'
            cat /tmp/pip-audit-full.txt 2>/dev/null || echo "no output"
            echo '```'
            echo ""
            echo "_Exceptions are listed with reasons in .github/workflows/security.yml._"
          } >> "$GITHUB_STEP_SUMMARY"

  frontend-dependencies:
    name: Frontend dependency audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '22.19'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      # `high` rather than `moderate`: the frontend is a browser bundle with
      # no server-side execution, and a moderate advisory in a build-time
      # dependency is not a reason to block a merge. High and critical are.
      # Raising the bar later is a decision; starting noisy just trains
      # people to pass --force.
      - name: Audit production dependencies
        working-directory: frontend
        run: npm audit --audit-level=high

  container-image:
    name: Container image rescan
    runs-on: ubuntu-latest
    # Scheduled and manual only.
    #
    # The per-commit scan lives in ci.yml, where it can declare `needs:` on
    # the job that publishes the image. It cannot live here: push to main
    # starts CI and Security as two independent runs, nothing orders them,
    # and this job used to lose that race every time — looking for an image
    # minutes before the build that produces it had started.
    #
    # What remains here is the check only a schedule can perform: ARC
    # shipped an artifact, and the world has moved since. A CVE disclosed
    # against a base-image package last Thursday is invisible to every
    # per-commit scan and is exactly the finding this exists for.
    if: github.event_name != 'pull_request' && github.event_name != 'push'
    permissions:
      contents: read
      packages: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Ask the registry what main currently publishes rather than assuming
      # an image exists for this SHA. On a schedule, github.sha is main's
      # tip, whose CI run may have failed or may still be in flight — and
      # "no image" must be a loud, legible failure, not a scan of something
      # arbitrary. Same discipline as promote.yml: resolve, then verify.
      - name: Resolve the published digest for main
        id: resolve
        run: |
          src="ghcr.io/${{ github.repository }}:${{ github.sha }}"
          if ! digest="$(docker buildx imagetools inspect "$src" \
                          --format '{{json .Manifest.Digest}}' 2>/dev/null)"; then
            echo "::error::no published image for ${{ github.sha }}."
            echo "::error::This scan consumes what CI published; it does not build."
            exit 1
          fi
          digest="${digest//\"/}"
          echo "image=ghcr.io/${{ github.repository }}@$digest" >> "$GITHUB_OUTPUT"
          echo "resolved $src -> $digest"

      - name: Rescan the image main currently publishes
        uses: ./.github/actions/scan-arc-image
        with:
          image-ref: ${{ steps.resolve.outputs.image }}
          context: 'the image main currently publishes (scheduled rescan)'
