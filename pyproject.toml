[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "arc"
version = "0.1.0"
description = "Arc — company intelligence and automation platform"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.116,<1.0",
    "psycopg[binary]>=3.2,<4.0",
    "asyncpg>=0.30,<1.0",
    "uvicorn[standard]>=0.35,<1.0",
    "PyJWT>=2.9,<3.0",
    "presidio-analyzer==2.2.364",
    "presidio-anonymizer==2.2.364",
    "spacy==3.8.15",
    "en-core-web-lg @ https://github.com/explosion/spacy-models/releases/download/en_core_web_lg-3.8.0/en_core_web_lg-3.8.0-py3-none-any.whl",
    "httpx>=0.28,<1.0",
    "openai>=3.17.0,<4.0",
    # Document text extraction for Company Brain ingestion (issue #299).
    # Both are pure Python with permissive licences suitable for
    # commercial multi-tenant use: pypdf is BSD-3-Clause, python-docx is
    # MIT. Neither requires a system binary, so a deployment gains PDF
    # and Word ingestion without new infrastructure.
    #
    # Image OCR is in the optional "ocr" extra below rather than here,
    # because Tesseract needs a system binary that pip cannot install.
    # ADR-014 records why the shipped engine is a local one and why it is
    # off by default. Without the extra, images are refused with a reason
    # naming OCR -- the behaviour this file previously described as
    # permanent.
    "pypdf>=5.0,<7.0",
    "python-docx>=1.1,<2.0",
    # Required by FastAPI to parse multipart bodies; the upload endpoint
    # returns 500 at import time without it, not a helpful 400.
    "python-multipart>=0.0.9,<1.0",
]

[project.optional-dependencies]
# Optical character recognition for scanned documents (issue #299,
# ADR-014). Separate from the base install on purpose:
#
#   - pytesseract is a thin wrapper that SHELLS OUT to a `tesseract`
#     binary. Installing the wheel without the binary yields an import
#     that works and an engine that does not, so this cannot be a base
#     dependency without making a broken install look like a working one.
#   - The engine is local by design. Reading a scan never sends a tenant
#     document anywhere, so enabling OCR is not also a data-residency
#     decision (ADR-014).
#
# Licences are suitable for commercial multi-tenant use: pytesseract is
# Apache-2.0, Pillow is MIT-CMU. The Tesseract binary itself is Apache-2.0
# and is invoked as a separate process, not linked.
#
# Install: pip install "arc[ocr]" plus the binary (apt-get install
# tesseract-ocr, or brew install tesseract), then OCR_PROVIDER=tesseract.
ocr = [
    "pytesseract>=0.3.10,<1.0",
    "Pillow>=10.0,<13.0",
]
dev = [
    # Pillow is how pypdf decodes the images embedded in a PDF, and the
    # scanned-PDF OCR path depends on that. It reaches a deployment
    # through the "ocr" extra above; it is repeated here so the tests
    # covering that path run against the real pypdf image API rather
    # than a stub, on any machine and in CI.
    "Pillow>=10.0,<13.0",
    "pytest>=8.4,<9.0",
    "pytest-asyncio>=0.23,<1.0",
    # Splits the suite across CI shards by recorded duration (.test_durations).
    # Shards are separate jobs with their own PostgreSQL, so the suite's
    # schema-dropping session fixture stays isolated per shard.
    "pytest-split>=0.9,<1.0",
    # Pinned exactly, not ranged: Ruff's formatter output can change between
    # releases, so a range lets a developer's machine and CI disagree about
    # whether the tree is formatted. The CI lint job reads this pin, so all
    # three environments lint with one version. Bump deliberately.
    "ruff==0.16.8",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
arc = ["db/schema.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "evaluation_real_llm: requires real LLM provider (OpenRouter); skipped when OPENROUTER_API_KEY is absent",
]

[tool.ruff]
target-version = "py312"
line-length = 100
exclude = ["build/"]

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.ruff.lint.isort]
known-first-party = ["arc"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
